name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-spa \
            libgl1 \
            libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          python -m pip check

      - name: Run tests
        run: |
          pytest -v --cov=. --cov-report=term-missing

  docker-build:
    name: Build and validate Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag siriusbot-ocr:ci \
            .

      - name: Run production container
        run: |
          docker run -d \
            --name siriusbot-ocr-smoke \
            --env APP_ENV=production \
            --publish 8000:8000 \
            siriusbot-ocr:ci

      - name: Wait for container health endpoint
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8000/api/v1/health > /tmp/health.json; then
              echo "Container is responding."
              cat /tmp/health.json
              exit 0
            fi

            echo "Waiting for container... attempt $i/30"
            sleep 2
          done

          echo "Container did not become ready."
          docker logs siriusbot-ocr-smoke
          exit 1

      - name: Validate health endpoint
        run: |
          curl --silent --fail \
            http://localhost:8000/api/v1/health

      - name: Validate readiness endpoint
        run: |
          curl --silent --fail \
            http://localhost:8000/api/v1/ready

      - name: Validate production API surface
        run: |
          for endpoint in \
            /docs \
            /redoc \
            /openapi.json \
            /api/v1/metrics
          do
            status=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://localhost:8000${endpoint})

            echo "${endpoint} -> HTTP ${status}"

            if [ "${status}" != "404" ]; then
              echo "Expected ${endpoint} to return HTTP 404 in production."
              exit 1
            fi
          done

      - name: Show container status
        run: |
          docker ps --filter "name=siriusbot-ocr-smoke"

      - name: Cleanup Docker container
        if: always()
        run: |
          docker rm -f siriusbot-ocr-smoke || true

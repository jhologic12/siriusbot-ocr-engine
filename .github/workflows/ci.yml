name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-spa \
            libgl1 \
            libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest -v --cov=. --cov-report=term-missing

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag siriusbot-ocr:ci \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name siriusbot-ocr-ci \
            -p 8000:8000 \
            siriusbot-ocr:ci

      - name: Wait for container health
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              siriusbot-ocr-ci)

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs siriusbot-ocr-ci
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy"
          docker logs siriusbot-ocr-ci
          exit 1

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8000/api/v1/health

      - name: Test readiness endpoint
        run: |
          curl --fail http://localhost:8000/api/v1/ready

      - name: Stop Docker container
        if: always()
        run: |
          docker stop siriusbot-ocr-ci || true
          docker rm siriusbot-ocr-ci || true
